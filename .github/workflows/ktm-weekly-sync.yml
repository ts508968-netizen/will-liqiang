name: KTM weekly subscription sync

on:
  push:
    branches:
      - codex/ktm-connectivity-probe
    paths:
      - .github/workflows/ktm-weekly-sync.yml
      - ktm-relay/sync.py
  workflow_dispatch:
  schedule:
    # Mondays 10:17 Asia/Shanghai (UTC+8)
    - cron: '17 2 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ktm-pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KTM_EMAIL: ${{ secrets.KTM_EMAIL }}
      KTM_PASSWORD: ${{ secrets.KTM_PASSWORD }}
      KTM_WRITE_TOKEN: ${{ secrets.KTM_WRITE_TOKEN }}
      KTM_READ_TOKEN: ${{ secrets.KTM_READ_TOKEN }}
      PAGES_FILE_KEY: ${{ secrets.PAGES_FILE_KEY }}
      PAGES_OUTPUT_DIR: /tmp/ktm-pages
      KTM_RELAY_URL: https://ktm-subscription-relay.ts508968.workers.dev
    steps:
      - uses: actions/checkout@v4
      - name: Install YAML parser
        run: python3 -m pip install --quiet PyYAML==6.0.2
      - name: Refresh filtered subscription
        run: python3 ktm-relay/sync.py
      - name: Upload private subscription artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/ktm-pages

  deploy-pages:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish subscription artifact
        id: deployment
        uses: actions/deploy-pages@v4
