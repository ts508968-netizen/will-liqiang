name: KTM connectivity probe

on:
  push:
    branches:
      - codex/ktm-connectivity-probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check unauthenticated KTM API reachability
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.error
          import urllib.request

          hosts = ("ktmcloud01.vip", "ktmcloud.top")
          for host in hosts:
              url = f"https://{host}/api/v1/user/getSubscribe"
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0 KTM-connectivity-probe"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=12) as response:
                      status = response.status
                      headers = response.headers
              except urllib.error.HTTPError as error:
                  status = error.code
                  headers = error.headers
              except Exception as error:
                  print(f"{host}: network_error={type(error).__name__}")
                  continue

              challenged = headers.get("cf-mitigated", "").lower() == "challenge"
              content_type = headers.get_content_type()
              print(
                  f"{host}: status={status} "
                  f"cf_mitigated_challenge={challenged} "
                  f"content_type={content_type}"
              )
          PY
